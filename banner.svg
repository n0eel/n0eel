<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#fbbf24;#34d399;#60a5fa;#f472b6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#fbbf24">
        <animate attributeName="stop-color" values="#fbbf24;#34d399;#60a5fa;#f472b6;#fbbf24" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#f472b6;#fbbf24;#34d399;#60a5fa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="200" rx="12" fill="#0b0b12"/>

  <!-- animated gradient border -->
  <rect x="2" y="2" width="796" height="196" rx="12" fill="none" stroke="url(#accent3)" stroke-width="1.5" opacity="0.8"/>

  <!-- terminal title bar -->
  <rect x="2" y="2" width="796" height="34" rx="12" fill="#111119"/>
  <rect x="2" y="24" width="796" height="12" fill="#111119"/>
  <circle cx="24" cy="19" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="5" fill="#febc2e"/>
  <circle cx="60" cy="19" r="5" fill="#28c840"/>
  <text x="400" y="24" text-anchor="middle" font-family="'Fira Code', 'Consolas', monospace" font-size="12" fill="#5c5c6e" letter-spacing="1">
    ~/portfolio — zsh
  </text>

  <!-- floating code glyphs -->
  <text x="90" y="70" font-family="monospace" font-size="18" fill="#f472b6" opacity="0.18">&lt;/&gt;</text>
  <text x="700" y="150" font-family="monospace" font-size="16" fill="#60a5fa" opacity="0.18">{ }</text>
  <text x="650" y="70" font-family="monospace" font-size="14" fill="#34d399" opacity="0.15">;</text>
  <text x="120" y="150" font-family="monospace" font-size="16" fill="#fbbf24" opacity="0.15">#!</text>

  <!-- prompt line + typed name -->
  <text x="60" y="100" font-family="'Fira Code', 'Consolas', monospace" font-size="15" fill="#5eead4">
    $
  </text>
  <text x="82" y="100" font-family="'Fira Code', 'Consolas', monospace" font-size="15" fill="#8b8ba3">
    whoami
  </text>

  <text x="60" y="140" font-family="'Fira Code', 'Consolas', monospace" font-weight="700" font-size="34" fill="#f5f5f7" letter-spacing="0.5">
    <tspan>your name</tspan>
    <animate attributeName="opacity" values="0;0;1" dur="1.4s" fill="freeze"/>
  </text>

  <!-- typing cursor after name -->
  <rect x="330" y="118" width="12" height="26" fill="#5eead4">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" begin="1.4s"/>
  </rect>

  <!-- tagline -->
  <text x="60" y="172" font-family="'Fira Code', 'Consolas', monospace" font-size="14" fill="#7f8ca3" letter-spacing="0.5">
    <tspan fill="#5eead4">$</tspan> echo "Full-Stack Developer"
  </text>

  <!-- underline sweep -->
  <rect x="60" y="180" width="0" height="2" rx="1" fill="url(#accent3)" filter="url(#glow3)">
    <animate attributeName="width" values="0;300" dur="1.2s" begin="2s" fill="freeze"/>
  </rect>
</svg>
